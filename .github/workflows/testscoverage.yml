name: testscoverage

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Report Coverage
        uses: fgouteroux/go-coverage-report@v1.2.0
        with:
          coverage-file: coverage.out
          fail-under: 60 